name: Capture live project screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-sites.yml"
      - "scripts/capture-sites.mjs"
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-sites.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          git diff --cached --quiet || git commit -m "assets: capture live client websites"
          git push
